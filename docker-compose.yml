# PriceWatch — development / demo stack.
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose exec web python manage.py seed_demo
#   open http://localhost:8000   (demo@pricewatch.local / DEMO_USER_PASSWORD)
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-app: &app
  image: pricewatch-app:latest
  build:
    context: .
    target: app
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media:/app/media

x-worker-health: &worker-health
  test: ["CMD-SHELL", "celery -A config inspect ping -d $${WORKER_NAME}@$$HOSTNAME --timeout 10 | grep -q pong"]
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 30s

services:
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker-fast:
    <<: *app
    environment:
      WORKER_NAME: fast
    command: celery -A config worker -Q fast -n fast@%h --concurrency=8 --loglevel=INFO
    healthcheck: *worker-health

  worker-browser:
    <<: *app
    image: pricewatch-browser:latest
    build:
      context: .
      target: browser
    environment:
      WORKER_NAME: browser
    command: celery -A config worker -Q browser -n browser@%h --concurrency=2 --max-tasks-per-child=50 --loglevel=INFO
    shm_size: "1gb"
    healthcheck: *worker-health

  worker-default:
    <<: *app
    environment:
      WORKER_NAME: default
    command: celery -A config worker -Q default -n default@%h --concurrency=2 --loglevel=INFO
    healthcheck: *worker-health

  beat:
    <<: *app
    command: celery -A config beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile=/tmp/celerybeat.pid --loglevel=INFO
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    <<: *app
    command: python -m bot.main
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/bot-heartbeat 2>/dev/null || echo 0) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pricewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricewatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5

  demo-shop:
    build: ./demo_shop
    restart: unless-stopped
    environment:
      DEMO_SHOP_CHANGE_INTERVAL: ${DEMO_SHOP_CHANGE_INTERVAL:-120}
    ports:
      - "8001:8001"
    networks:
      default:
        aliases:
          - techbozor.demo
          - megasavdo.demo
          - smartmarket.demo

volumes:
  pgdata:
  redisdata:
  media:
